# Jarvis – Startwerte
# Diese Datei wird beim Bauen in die App gepackt. Alles hier lässt sich später in der
# Jarvis-App unter „Einstellungen“ ändern; dort Eingetragenes gilt vor dieser Datei.
# Zugangsschlüssel (Groq, Gemini, Telegram) gehören NICHT hier hinein – die trägst du
# in der App ein, dort werden sie verschlüsselt gespeichert.

# ---- Wer bist du? -------------------------------------------------------------
user_name = Max
# kurz, z. B.: 8. Klasse, Musterschule (8a), wohnt in Musterstadt
user_about =
assistant_name = Jarvis

# ---- Gehirn -------------------------------------------------------------------
#   beides      Claude (dein Abo, über Termux) antwortet, der API-Schlüssel (Groq) springt ein,
#               wenn Claude nicht erreichbar oder das Abo-Limit erreicht ist
#   nur-claude  nur Claude; ohne Claude antwortet Jarvis nicht frei
#   nur-api     nur der API-Schlüssel (Groq, kostenlos) – kein Termux/Claude nötig
brain = beides

# ---- Schule -------------------------------------------------------------------
# 0 = aus (Standard), 1 = an. Danach in der App die Schule einrichten.
school_enabled = 0
# EduPage-Subdomain, z. B. meineschule für meineschule.edupage.org
edu_subdomain =

# ---- Wohnort fürs Wetter (Breiten-/Längengrad) ----------------------------------
weather_lat =
weather_lon =

# ---- Ruhezeit und Anrufe --------------------------------------------------------
quiet_start = 21:30
quiet_end = 07:00
call_enabled = 1
call_max_day = 2
# Weckanruf an Schultagen, z. B. 06:40 (leer = aus)
wake_call =
